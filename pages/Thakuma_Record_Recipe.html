<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Tiro+Bangla:ital@0;1&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
<style>
:root{--cream:#FBF1DC;--paper:#FFF8EA;--red:#B3231B;--red2:#8E1710;--green:#1F4A37;--gold:#E0A526;--ink:#3A1E12;--muted:#7a5a49;--beige:#F3E6CB;--line:rgba(179,35,27,.14);--sh:0 8px 28px rgba(90,50,20,.10);--card:#FFFDF8}
*{box-sizing:border-box;margin:0}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{font-family:'Hind Siliguri',sans-serif;color:var(--ink);background:radial-gradient(circle at 12% 0,rgba(224,165,38,.14),transparent 40%),radial-gradient(circle at 90% 20%,rgba(255,190,150,.16),transparent 40%),var(--cream);font-size:14px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.serif{font-family:'Tiro Bangla',serif;font-weight:400}.pf{font-family:'Playfair Display',serif}
nav{position:sticky;top:10px;z-index:5;max-width:1180px;margin:10px auto 0;width:calc(100% - 44px);display:flex;align-items:center;gap:18px;padding:8px 14px;background:rgba(255,248,234,.85);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:999px;box-shadow:var(--sh)}
.brand{display:flex;flex-direction:column;line-height:1.1}.brand b{font-family:'Tiro Bangla';font-weight:400;font-size:20px;color:var(--red2)}.brand small{font-size:8px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px;align-self:flex-start;margin-top:2px}
nav .links{margin-left:auto;display:flex;gap:18px;font-size:12px;font-weight:500}nav .links a{color:var(--ink);text-decoration:none;background:linear-gradient(var(--red),var(--red)) 0 100%/0 1.5px no-repeat;transition:.3s}nav .links a:hover{background-size:100% 1.5px}
.pill{border:0;border-radius:999px;background:linear-gradient(180deg,#c6302a,var(--red2));color:#fff;font-weight:600;font-size:12px;padding:8px 16px;box-shadow:0 4px 12px rgba(142,23,16,.3)}
.ic{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--paper);display:grid;place-items:center;font-size:13px}
.avatar{background:var(--red2);color:#fff;border:0}
#lang{display:flex;background:var(--beige);border-radius:999px;padding:3px;gap:2px}#lang button{border:0;background:none;border-radius:999px;padding:6px 16px;font-size:13px;font-weight:700;color:var(--muted);transition:.25s}#lang button.on{background:linear-gradient(180deg,#c6302a,var(--red2));color:#fff;box-shadow:0 3px 10px rgba(142,23,16,.3)}
.banner{max-width:1180px;margin:14px auto 0;width:calc(100% - 44px);background:#F6D9D3;border:1px solid #ecc3bb;border-radius:8px;padding:9px 14px;font-size:12px;display:flex;gap:8px;align-items:center}.banner button{margin-left:auto;border:0;background:none;font-size:14px}
main{max-width:1180px;margin:22px auto 0;width:calc(100% - 44px);display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);gap:26px;align-items:start}
.card{background:var(--card);border:1px solid rgba(179,35,27,.08);border-radius:14px;box-shadow:var(--sh);padding:18px 20px;margin-bottom:18px}
.tag{display:inline-block;font-size:9px;font-weight:600;color:var(--red2);background:#F6D9D3;border-radius:999px;padding:2px 9px}
h1{font-family:'Tiro Bangla';font-weight:400;font-size:26px;color:var(--green);margin:8px 0 4px}h1 span{font-family:'Playfair Display';font-size:24px}
.sub{color:var(--muted);font-size:13px;max-width:560px}
.hd{display:flex;justify-content:space-between;gap:12px}.hd .badge{background:#DDEBDD;color:var(--green);border-radius:8px;padding:6px 10px;font-size:10px;font-weight:600;align-self:center;max-width:150px;line-height:1.3}
label.f{display:block;font-size:11px;font-weight:600;margin-bottom:5px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:14px}
.in{width:100%;background:var(--beige);border:1px solid rgba(179,35,27,.1);border-radius:8px;padding:9px 12px;font:inherit;font-size:13px;color:var(--ink)}
.consent{display:flex;gap:10px;align-items:flex-start;margin-top:12px;background:#F6D9D3;border-radius:8px;padding:9px 12px}.consent input{accent-color:var(--red);margin-top:4px;width:16px;height:16px}.consent small{display:block;color:var(--muted);font-size:10px}
.tabs{display:flex;gap:6px;background:var(--beige);padding:6px;border-radius:10px;width:max-content;max-width:100%;overflow:auto}
.tabs button{border:0;background:none;border-radius:8px;padding:6px 14px;font-size:12px;font-weight:500}.tabs button.on{background:var(--red);color:#fff;font-weight:600}
.stage{text-align:center;padding:24px 0 6px}
.mic{position:relative;width:130px;height:130px;margin:0 auto 10px;display:grid;place-items:center}
.mic::before,.mic::after{content:"";position:absolute;border-radius:50%;background:rgba(179,35,27,.1)}.mic::before{inset:0}.mic::after{inset:18px;background:rgba(179,35,27,.12)}
.mic.rec::before{animation:pulse 1.6s infinite}@keyframes pulse{50%{transform:scale(1.12);opacity:.5}}
.mic button{position:relative;z-index:1;width:64px;height:64px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#d4352d,var(--red2));color:#fff;font-size:26px;box-shadow:0 6px 18px rgba(142,23,16,.4)}
.mic button:disabled{filter:grayscale(.6);opacity:.55;cursor:not-allowed}
.timer{font-family:'Playfair Display';font-weight:700;font-size:22px;color:var(--ink);letter-spacing:1px}.timer i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-right:6px;vertical-align:middle}.timer small{font:500 11px 'Hind Siliguri';color:var(--muted);letter-spacing:0;margin-left:6px}
.wave{height:70px;display:flex;align-items:flex-end;justify-content:center;gap:5px;margin:14px 0 4px}.wave b{width:6px;background:var(--red);border-radius:3px;height:6px;transition:height .12s}
.meta{display:flex;justify-content:space-between;font-size:9px;color:var(--muted);padding:0 4px}.meta span:nth-child(2){background:var(--beige);border-radius:5px;padding:1px 8px;font-weight:600;color:var(--green)}
.hint{margin:10px auto 0;max-width:420px;font-size:12px;color:var(--muted)}
.tr{background:var(--beige);border-radius:10px;padding:10px 14px;margin:14px 0;text-align:left;font-size:11px;display:none}.tr.on{display:block}.tr .bar{height:5px;border-radius:3px;background:repeating-linear-gradient(45deg,var(--red) 0 6px,#d9594f 6px 12px);margin:5px 0;width:0;transition:width .6s}.tr p{color:var(--muted);font-style:italic;font-size:12px}.tr .t{display:flex;justify-content:space-between;font-weight:600;color:var(--red2)}
.acts{display:flex;gap:12px;justify-content:center;margin-top:12px}.acts button{border-radius:8px;padding:11px 22px;font-size:13px;font-weight:600;border:1px solid rgba(179,35,27,.18);background:var(--paper)}.acts .go{background:linear-gradient(180deg,#c6302a,var(--red2));color:#fff;border:0;box-shadow:0 4px 12px rgba(142,23,16,.3)}.acts .go:disabled{opacity:.5;cursor:not-allowed}
.pane{display:none;padding:22px 0 4px}.pane.on{display:block}
.drop{border:2px dashed rgba(179,35,27,.3);border-radius:12px;background:var(--beige);padding:34px 16px;text-align:center;color:var(--muted);font-size:13px}.drop u{color:var(--red);font-weight:600;cursor:pointer}
textarea.in{min-height:140px;resize:vertical}
.ai h3,.side h3{font-family:'Tiro Bangla';font-weight:400;font-size:16px;color:var(--green)}.ai .hd .tag{background:#F6D9D3}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.chip{background:var(--beige);border-radius:8px;padding:8px 10px;display:flex;gap:8px;align-items:center;font-size:11px;font-weight:600}.chip em{display:block;font-style:normal;font-weight:400;color:var(--red2);font-size:10px}.chip i{width:22px;height:22px;border-radius:6px;background:#F6D9D3;display:grid;place-items:center;font-style:normal;font-size:11px;flex:none}.ai .note{font-size:11px;color:var(--muted);margin-top:8px}
.photo{border-radius:14px;overflow:hidden;box-shadow:var(--sh);margin-bottom:18px;background:var(--card);border:1px solid rgba(179,35,27,.08)}.pw{position:relative}.photo img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block}.cap{position:absolute;left:0;right:0;bottom:0;padding:26px 12px 10px;background:linear-gradient(transparent,rgba(58,30,18,.72));color:#fff;font-family:"Tiro Bangla",serif;font-size:15px}.photo p{font-size:9px;color:var(--green);padding:6px 10px;background:#fff;border-top:1px solid #eee}
.side h3{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.tip{display:flex;gap:10px;margin-top:10px}.tip i{width:20px;height:20px;border-radius:50%;background:#F6D9D3;color:var(--red2);display:grid;place-items:center;font-style:normal;font-size:10px;flex:none;font-weight:700}.tip b{font-size:12px;color:var(--red2);display:block}.tip span{font-size:11px;color:var(--muted)}
.pink{background:#F9DDD7;border-color:#efc7be}.pink h4{font-family:'Tiro Bangla';font-weight:400;font-size:15px;color:var(--ink);margin:6px 0}.pink p{font-size:11px;color:var(--muted)}.pink a{display:inline-block;margin-top:8px;font-size:11px;font-weight:600;color:var(--red);text-decoration:none}
.welcome{background:var(--green);color:var(--paper);border-radius:14px;padding:14px 18px;margin-bottom:18px;box-shadow:var(--sh)}.welcome h4{font-family:'Tiro Bangla';font-weight:400;font-size:16px;margin-bottom:6px}.welcome ol{display:flex;gap:12px;padding:0;list-style:none;font-size:12px;flex-wrap:wrap}.welcome li{flex:1 1 150px;display:flex;gap:8px}.welcome li b{width:20px;height:20px;border-radius:50%;background:var(--gold);color:var(--green);display:grid;place-items:center;font-size:11px;flex:none}
footer{max-width:1180px;margin:30px auto 0;width:calc(100% - 44px);background:var(--beige);border-radius:14px 14px 0 0;padding:20px 22px 60px;display:flex;justify-content:space-between;align-items:center;font-size:10px;color:var(--muted);gap:12px;flex-wrap:wrap}footer .brand b{font-size:17px}footer nav2 a{margin-left:16px}
.toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:8px;padding:8px 16px;font-size:11px;font-weight:500;z-index:9;box-shadow:var(--sh)}.toast i{color:#7ed39a;font-style:normal;margin-right:6px}
@media(max-width:860px){main{grid-template-columns:1fr}nav .links{display:none}nav #lang{margin-left:auto}.row{grid-template-columns:1fr}.chips{grid-template-columns:1fr}.hd .badge{display:none}.pill span.l{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.site-header .brand-mark{flex:0 0 auto;width:48px;height:48px;display:block;border-radius:50%;object-fit:contain;background:rgba(255,248,234,.9);filter:drop-shadow(0 5px 9px rgba(80,30,12,.18));}
.site-header .brand-copy{display:block;min-width:0}
.site-header .brand-name{display:block;color:#b3231b;font-family:'Tiro Bangla',serif;font-size:19px;font-weight:400;line-height:1.1;white-space:nowrap}
html.lang-en .site-header .brand-name,body.lang-en .site-header .brand-name{font-family:'Playfair Display',serif;font-style:italic}
.site-header .brand-caption{display:block;margin-top:3px;color:#7a5a45;font-family:'Hind Siliguri',sans-serif;font-size:9px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.site-header .main-nav{display:flex;align-items:center;gap:25px;margin-left:auto}
.site-header .nav-link{position:relative;display:inline-flex;align-items:center;padding:10px 0;color:#7a5a45;font-family:'Plus Jakarta Sans','Hind Siliguri',sans-serif;font-size:13px;font-weight:600;text-decoration:none;white-space:nowrap;transition:color .2s ease}
.site-header .nav-link:hover,.site-header .nav-link.active{color:#3a1e12}
.site-header .nav-link:after{content:'';position:absolute;left:0;right:0;bottom:3px;height:2px;width:0;background:#b3231b;border-radius:2px;transition:width .25s ease}
.site-header .nav-link:hover:after,.site-header .nav-link.active:after{width:100%}
.site-header .header-actions{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.site-header .language-switch{display:inline-flex;align-items:center;gap:3px;padding:3px;border:0;border-radius:999px;background:#f1dfbd}
.site-header .language-switch button{min-width:43px;padding:6px 11px;border:0;border-radius:999px;color:#3a1e12;background:transparent;font-family:'Plus Jakarta Sans','Hind Siliguri',sans-serif;font-size:12px;font-weight:700;line-height:1.3;cursor:pointer;transition:background .2s ease,color .2s ease,box-shadow .2s ease}
.site-header .language-switch button[aria-pressed="true"],.site-header .language-switch button.active,.site-header .language-switch button.selected,.site-header .language-switch button.on{color:#fff;background:#b3231b;box-shadow:0 3px 9px rgba(142,23,16,.22)}
.site-header .avatar-mini{width:34px;height:34px;display:grid;place-items:center;border:0;border-radius:50%;background:#1f4a37;color:#fff8ea;font-family:'Hind Siliguri',sans-serif;font-size:12px;font-weight:600;line-height:1;cursor:pointer}
.site-header .header-icon{width:34px;height:34px;display:grid;place-items:center;border:1px solid rgba(179,35,27,.13);border-radius:50%;background:rgba(255,248,234,.82);color:#7a5a45;cursor:pointer;transition:background .2s ease,color .2s ease,border-color .2s ease}
.site-header .header-icon:hover{background:#f1dfbd;color:#b3231b;border-color:rgba(179,35,27,.28)}
.site-header .header-icon svg{width:17px;height:17px;display:block}
.site-header .mobile-nav{display:none}
/* Profile-page spoon cursor. No particles or particle canvas. */
#spoon{position:fixed;left:0;top:0;z-index:120;width:46px;height:46px;margin:-6px 0 0 -6px;pointer-events:none;filter:drop-shadow(0 4px 4px rgba(80,20,10,.35));transform-origin:6px 6px;will-change:transform}
@media(pointer:fine){body,body a,body button,body input,body select{cursor:none!important}}
@media(pointer:coarse){#spoon{display:none!important}}
@media(prefers-reduced-motion:reduce){#spoon{display:none!important}body,body a,body button,body input,body select{cursor:auto!important}}
@media(max-width:820px){.site-header .header-inner{width:min(100% - 32px,760px)}.site-header .main-nav{gap:17px}.site-header .nav-link{font-size:11px}}
@media(max-width:620px){
 .site-header .header-inner{width:calc(100% - 24px);min-height:58px;margin-top:7px;padding:7px 12px;gap:8px}
 .site-header .brand{gap:8px}
 .site-header .brand-mark{width:39px;height:39px}
 .site-header .brand-name{font-size:16px}
 .site-header .brand-caption{font-size:7px;letter-spacing:.1em}
 .site-header .main-nav{display:none}
 .site-header .header-actions{gap:7px}
 .site-header .language-switch button{min-width:36px;padding:6px 7px;font-size:10px}
 .site-header .avatar-mini,.site-header .header-icon{width:30px;height:30px;font-size:10px}

 .site-header .mobile-nav .nav-link{padding:0;color:#7a5a45;font-family:'Hind Siliguri',sans-serif;font-size:10px;font-weight:700}
 .site-header .mobile-nav .nav-link:after{display:none}
 .site-header .mobile-nav .nav-link.active{color:#b3231b}
}

<div class="card"><h3><span style="color:var(--red)">💡</span> <span data-bn="সহজ কিছু পরামর্শ (Helpful Tips)" data-en="Helpful tips"></span></h3><p class="sub" style="font-size:11px" data-bn="রেকর্ডিং করার সময় এই তিনটি বিষয় খেয়াল রাখলে হাতের আন্দাজের অনুমান সবচেয়ে নির্ভুল হয়:" data-en="Keep these three things in mind while recording and the hand estimates will be most accurate:"></p>
<div class="tip"><i>1</i><div><b data-bn="ধাপে ধাপে বলতে থাকুন (Say each step in order)" data-en="Say each step in order"></b><span data-bn="ফোড়ন দেওয়া থেকে নামানোর মুহূর্ত পর্যন্ত পরপর বলে যান।" data-en="From tempering the spices to taking the pot off the stove, go step by step."></span></div></div>
<div class="tip"><i>2</i><div><b data-bn="নিজের আন্দাজে বলুন (Say amounts naturally)" data-en="Say amounts naturally"></b><span data-bn="গ্রাম বা মিলি বলার দরকার নেই; 'এক চিমটি', 'আধ চামচ' বা 'এক আঁজলা' বলুন।" data-en="No need for grams or ml; say 'one pinch', 'half a spoon' or 'a cupped palm'."></span></div></div>

(() => {
  const spoon = document.getElementById('spoon');
  const finePointer = window.matchMedia && window.matchMedia('(pointer: fine)').matches;
  const reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!spoon || !finePointer || reducedMotion) return;

  let targetX = -100, targetY = -100, spoonX = -100, spoonY = -100;
  let targetRotation = 0, rotation = 0, targetScale = 1, scale = 1;
  let frame = 0;

  function animate() {
    spoonX += (targetX - spoonX) * .28;
    spoonY += (targetY - spoonY) * .28;
    rotation += (targetRotation - rotation) * .22;
    scale += (targetScale - scale) * .2;
    spoon.style.transform = `translate3d(${spoonX}px, ${spoonY}px, 0) rotate(${rotation}deg) scale(${scale})`;
    frame = requestAnimationFrame(animate);
  }

  window.addEventListener('pointermove', (event) => {
    const movementX = event.movementX || 0;
    targetX = event.clientX;
    targetY = event.clientY;
    targetRotation = Math.max(-25, Math.min(25, movementX * 1.2));
  }, { passive: true });
  window.addEventListener('pointerdown', () => {
    targetScale = .8;
    window.setTimeout(() => { targetScale = 1; }, 110);
  }, { passive: true });
  window.addEventListener('blur', () => { targetX = targetY = -100; });
  document.addEventListener('pointerover', (event) => {
    if (event.target.closest('a, button, input, select, .unit-option')) targetScale = 1.3;
  });
  document.addEventListener('pointerout', (event) => {
    if (event.target.closest('a, button, input, select, .unit-option')) targetScale = 1;
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { cancelAnimationFrame(frame); frame = 0; }
    else if (!frame) animate();
  });
  animate();
})();

// Keep the selected language's accessible state in sync with each page's existing switch logic.
(() => {
  const buttons = [...document.querySelectorAll('.site-header .language-switch button')];
  buttons.forEach(button => button.addEventListener('click', () => {
    requestAnimationFrame(() => {
      let active = document.documentElement.lang;
      if (!['bn', 'en'].includes(active)) active = document.body.classList.contains('lang-en') ? 'en' : 'bn';
      buttons.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === active || b.dataset.l === active || b.dataset.language === active)));
    });
  }));
})();
